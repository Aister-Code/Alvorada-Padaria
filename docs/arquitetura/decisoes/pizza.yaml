decisions:
  - id: DEC-CATALOGO-001
    status: approved_later
    title: Migracao do catalogo real Alvorada
    statement: O documento auditado CATALOG-INSTANCE-ALVORADA-001 e a fonte comercial da migracao; dados confirmados devem ser migrados para o Convex DEV de forma idempotente; pendencias nao bloqueiam os demais itens; preco pendente nunca vira zero; registros pendentes nao ficam vendaveis; produtos existentes nao devem ser excluidos sem reconciliacao; categorias visiveis novas nao devem ser criadas sem aprovacao; o catalogo real do Convex e a fonte da verdade no fluxo normal.
    prohibits:
      - converter preco pendente em zero
      - tornar registro pendente vendavel
      - criar duplicata em segunda execucao
      - excluir produto existente sem reconciliacao
      - criar menu visivel novo sem aprovacao
      - usar fixture generica como fonte normal quando Convex responder
      - aplicar dados simulados em producao, carrinho, Pedido ou snapshot
    sources:
      - docs/arquitetura/Catalogo/CATALOG-INSTANCE-ALVORADA-001.md:1
      - docs/arquitetura/Catalogo/CATALOG-INSTANCE-ALVORADA-001.md:33
      - docs/arquitetura/Catalogo/CATALOG-INSTANCE-ALVORADA-001.md:64
      - docs/arquitetura/Catalogo/CATALOG-INSTANCE-ALVORADA-001.md:525
      - docs/arquitetura/Catalogo/CATALOG-MODEL-ALVORADA-001.md:1
      - Usuario, conversa de 2026-07-28: MIGRACAO CONTROLADA - CATALOGO REAL ALVORADA + PREVIA DEV DE ADICIONAIS DE PIZZA
    forbidden_copy: []

  - id: DEC-CATALOGO-002
    status: approved_later
    title: Carrinho flutuante e ajuda com destaque premium
    statement: O carrinho flutuante do catalogo deve funcionar como mini-cart ou dock mais evidente quando houver item adicionado, com icone, bloco textual e CTA claro; o canal de ajuda permanece secundario ao carrinho quando ha item, mas com acabamento mais visivel, contraste adequado e aparencia confiavel. A mudanca e exclusivamente visual e de UX, sem alterar regras de negocio, calculo, backend, schema, pedido, carrinho logico ou checkout.
    prohibits:
      - alterar regra de negocio do carrinho
      - alterar calculo, backend, schema, pedido ou checkout
      - criar fluxo novo de carrinho ou ajuda
      - enfraquecer a hierarquia do carrinho quando houver item
    sources:
      - Usuario, conversa de 2026-07-29: refinamento premium do carrinho flutuante e canal de ajuda do catalogo
    forbidden_copy: []

  - id: DEC-CATALOGO-003
    status: approved_later
    title: Ajuda integrada ao dock do carrinho
    statement: Com carrinho ativo, Ajuda fica visualmente anexada ao dock; carrinho e Ajuda possuem acoes e areas de toque separadas; Ver carrinho permanece como acao comercial principal; Ajuda ocupa o extremo direito, separada por divisor sutil; sem carrinho, Ajuda retorna ao formato de FAB independente; a integracao nao altera canal, contexto ou comportamento funcional da Ajuda; o refinamento deve liberar espaco vertical sem reduzir acessibilidade.
    prohibits:
      - manter Ajuda como FAB separado acima do dock quando houver carrinho
      - sobrepor areas clicaveis de carrinho e Ajuda
      - alterar canal, contexto ou comportamento funcional da Ajuda
      - alterar total, quantidade, checkout, pedido, carrinho logico, backend ou schema
      - renderizar texto Ajuda dentro do dock com carrinho ativo
    sources:
      - Usuario, conversa de 2026-07-29: REFINAMENTO CONTROLADO - AJUDA ANEXADA AO DOCK DO CARRINHO
    forbidden_copy: []

  - id: DEC-CATALOGO-004
    status: approved_later
    title: Dock do carrinho com superficie oliva
    statement: Com itens no carrinho, o dock usa fundo oliva escuro reutilizando exatamente a superficie ja existente em Pizza Atual; nao criar nova tonalidade paralela; carrinho permanece como acao principal; Ajuda permanece anexada e secundaria; sem carrinho, o FAB independente de Ajuda permanece como esta.
    prohibits:
      - usar fundo branco, bege claro ou gradiente no dock ativo do carrinho
      - criar nova tonalidade paralela para substituir o oliva canonico
      - alterar CTA Ver carrinho, fluxo, total, quantidade, canal de Ajuda, checkout, pedido, backend ou schema
      - alterar o FAB independente de Ajuda quando o carrinho estiver vazio
    sources:
      - src/pages/catalog/_components/PizzaBuilder.tsx:1608
      - src/pages/catalog/_components/PizzaBuilder.tsx:1655
      - Usuario, conversa de 2026-07-29: REFINAMENTO PONTUAL - DOCK DO CARRINHO EM OLIVA ESCURO
    forbidden_copy: []

  - id: DEC-CATALOGO-005
    status: approved_later
    title: Distribuicao uniforme do menu de categorias
    statement: No menu compacto do catalogo, a lupa permanece fixa na extremidade esquerda, o expansor permanece fixo na extremidade direita, e as cinco categorias principais ocupam uma regiao central estavel com centros uniformemente distribuidos; icone, texto e indicador ativo de cada categoria compartilham o mesmo eixo; o comprimento do rotulo nao pode deslocar a categoria vizinha; os alinhamentos externos ja aprovados devem ser preservados.
    prohibits:
      - distribuir categorias pela largura natural dos rotulos
      - usar justify-between para espacamento das categorias principais
      - aplicar margens, offsets ou transformacoes especificas por categoria
      - permitir que Destaques invada a celula de Lanches
      - deslocar a lupa ou o expansor homologados
      - alterar busca, sticky, textos, icones, fonte, cards, carrinho, Ajuda, PizzaBuilder, backend ou schema
    sources:
      - Usuario, conversa de 2026-07-30: CORRECAO PONTUAL - DISTRIBUICAO HARMONICA DO MENU DE CATEGORIAS
    forbidden_copy: []

  - id: DEC-CATALOGO-006
    status: approved_later
    title: Alinhamento optico do menu de categorias
    statement: O menu de categorias deve preservar lupa e expansor nas extremidades e cinco celulas simetricas, mas a homologacao depende da percepcao visual real; icone, rotulo e indicador ativo compartilham o mesmo eixo; as distancias aparentes entre rotulos vizinhos devem parecer uniformes; nenhum rotulo pode parecer unido ao seguinte; a correcao deve ser global e simetrica, sem ajustes individuais por categoria.
    prohibits:
      - declarar sucesso apenas por centros matematicamente regulares
      - usar margin, translate, largura ou offset especifico por categoria
      - condicionar ajuste ao texto de Destaques ou Lanches
      - permitir fusao visual entre Destaques e Lanches
      - fazer underline invadir visualmente categorias vizinhas
      - alterar textos, icones, ordem, busca, sticky, cabecalho, expansor, categorias secundarias, cards, carrinho, Ajuda, PizzaBuilder ou backend
    sources:
      - Usuario, conversa de 2026-07-30: CORRECAO PONTUAL - ALINHAMENTO OPTICO, HARMONICO E SIMETRICO DO MENU
    forbidden_copy: []

  - id: DEC-CATALOGO-007
    status: approved_later
    title: Ritmo vertical uniforme do menu de categorias
    statement: Todos os itens do menu de categorias usam a mesma estrutura e as mesmas metricas verticais; o estado ativo nao altera gap, altura, line-height ou posicao; icone, rotulo e indicador ativo mantem eixos e distancias constantes; o underline deve ficar absoluto e fora do fluxo, sem mudar a altura do item.
    prohibits:
      - alterar gap, altura, line-height ou posicao por estado ativo
      - renderizar indicador ativo de forma que mude a estrutura vertical do item
      - usar offsets, margens ou transformacoes especificas por categoria
      - deixar Destaques com ritmo vertical diferente das demais categorias
      - alterar textos, icones, ordem, busca, sticky, cabecalho, cards, carrinho, Ajuda, PizzaBuilder ou backend
    sources:
      - Usuario, conversa de 2026-07-30: CORRECAO CONTROLADA - RITMO VERTICAL DO MENU E ALTERNANCIA DIA/NOITE
      - DEC-CATALOGO-005
      - DEC-CATALOGO-006
    forbidden_copy: []

  - id: DEC-CATALOGO-008
    status: approved_later
    title: Alternancia funcional de tema Dia/Noite
    statement: O botao Dia/Noite alterna efetivamente entre os temas claro e escuro em todo o catalogo; o parametro theme da URL pode definir o estado inicial, mas nao pode bloquear a alternancia do usuario; a mudanca preserva o sistema de tema e os tokens existentes.
    prohibits:
      - reaplicar o parametro theme da URL de modo que desfaça o clique do usuario
      - criar sistema paralelo de tema fora do provider existente
      - limitar a alternancia a uma parte isolada do catalogo
      - alterar textos, icones, menu, cards, carrinho, Ajuda, ProductSheet, PizzaBuilder, backend ou schema fora do necessario ao tema
    sources:
      - src/components/providers/theme.tsx
      - Usuario, conversa de 2026-07-30: CORRECAO CONTROLADA - RITMO VERTICAL DO MENU E ALTERNANCIA DIA/NOITE
    forbidden_copy: []

  - id: DEC-CATALOGO-009
    status: approved_later
    title: Distribuicao optica do menu por largura real dos conjuntos
    statement: A regiao central do menu de categorias nao usa cinco celulas iguais nem centros equidistantes como metrica principal; as categorias principais sao distribuidas conforme a largura real de cada conjunto visual, com wrappers de largura real, espaco livre igualmente distribuido entre os wrappers, icone, texto e underline centralizados dentro de cada wrapper, e sem flex-grow nos itens. A regra substitui a parte conflitante das decisoes anteriores que usava cinco areas iguais, preservando lupa e expansor nas extremidades, ritmo vertical uniforme, underline fora do fluxo e ausencia de ajustes individuais por categoria.
    supersedes:
      - DEC-CATALOGO-005: regra conflitante de cinco celulas iguais e centros uniformemente distribuidos
      - DEC-CATALOGO-006: medicao por centros como principal evidencia de alinhamento
    prohibits:
      - usar grid-template-columns repeat(5, minmax(0, 1fr)) na regiao das categorias principais
      - usar flex-grow, flex: 1, width 20% ou comportamento equivalente para forcar cinco areas iguais
      - perseguir centros equidistantes como metrica principal da correcao optica
      - aplicar margin, offset, translate, largura ou ajuste individual por categoria
      - alterar tema, textos, icones, ordem, busca, sticky, cabecalho, cards, carrinho, Ajuda, PizzaBuilder, ProductSheet, backend ou schema
    sources:
      - Usuario, conversa de 2026-07-30: NAO CONFORMIDADE - A CORRECAO OPTICA DEC-CATALOGO-009 NAO FOI EXECUTADA
    forbidden_copy: []

  - id: DEC-CATALOGO-010
    status: approved_later
    title: Gap uniforme entre conjuntos visuais das categorias
    statement: O espacamento do menu principal do catalogo deve ser medido entre os elementos efetivamente visiveis de cada categoria, compostos por icone, rotulo e underline; areas invisiveis de toque nao podem interferir no espacamento optico; os quatro gaps visiveis usam um unico valor global, o grupo visual completo permanece centralizado entre lupa e expansor, e nao sao permitidos offsets, margens, larguras ou transformacoes especificas por categoria. A regra substitui a parte conflitante da DEC-CATALOGO-009 que considerava o bounding box do wrapper com area minima de toque como referencia do gap.
    supersedes:
      - DEC-CATALOGO-009: medicao por wrapper clicavel ou area minima de toque como referencia do gap visual
    prohibits:
      - medir gaps pelo wrapper clicavel quando ele inclui area invisivel de toque
      - deixar min-width 44px, padding ou hit area determinar a distribuicao optica
      - usar justify-between, space-around, flex-grow, cinco colunas iguais, width 20%, margens individuais ou translateX especifico na regiao visual principal
      - aplicar correcao exclusiva em Destaques, Lanches ou qualquer categoria isolada
      - alterar tema, ritmo vertical, textos, icones, ordem, busca, sticky, carrinho, Ajuda, cards, PizzaBuilder, ProductSheet, backend ou schema
    sources:
      - Usuario, conversa de 2026-07-30: CORRECAO BLOQUEANTE - ESPACAMENTO UNIFORME ENTRE OS ELEMENTOS VISIVEIS DO MENU
    forbidden_copy: []

  - id: DEC-CATALOGO-011
    status: approved_later
    title: Areas de toque independentes em telas estreitas
    statement: A camada visual do menu de categorias continua distribuida por conteudo e gaps opticos homologados, enquanto a camada interativa e calculada separadamente; areas clicaveis vizinhas nunca podem se sobrepor, cada toque deve acionar somente a categoria pretendida, e a correcao interativa nao pode alterar o alinhamento visual homologado em 408px. Em telas estreitas, as zonas de toque usam fronteiras deterministicas pelos pontos medios entre os centros visuais das categorias, preservando altura minima de 44px, foco visivel e eventos isolados.
    supersedes:
      - DEC-CATALOGO-010: uso de pseudo-elementos de 44px por item como area de toque quando quase encostam em telas estreitas
    prohibits:
      - alterar os gaps visuais de 19px em 408px
      - alterar posicao dos icones, rotulos, underlines, centralizacao visual, tipografia, ritmo vertical, lupa, expansor ou tema
      - usar pseudo-elementos de 44px por item quando isso cria fronteiras quase encostadas sem divisao deterministica
      - reintroduzir cinco colunas visuais iguais, flex-grow, margens individuais, offsets especificos ou reducao isolada de gap por categoria
      - permitir sobreposicao entre zonas clicaveis ou acionamento duplo de categorias vizinhas
    sources:
      - Usuario, conversa de 2026-07-30: CORRECAO PONTUAL - AREAS DE TOQUE SEGURAS NO MENU EM 320PX
    forbidden_copy: []

