  - id: DEC-PIZZA-010
    status: approved_later
    title: Escopo dos adicionais da pizza
    statement: Adicionais por metade pertencem a respectiva metade; adicionais globais pertencem a pizza inteira; adicionais por metade aparecem depois das retiradas e antes da confirmacao da metade; adicionais globais aparecem depois das duas metades e antes da revisao; secoes vazias nao sao renderizadas; backend continua autoritativo para disponibilidade e preco.
    prohibits:
      - aplicar adicional de uma metade a outra silenciosamente
      - renderizar secao vazia de adicionais
      - inventar adicional, preco, regra ou fixture como verdade de producao
      - misturar borda com adicionais
    sources:
