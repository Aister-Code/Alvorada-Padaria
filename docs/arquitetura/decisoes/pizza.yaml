  - id: DEC-PIZZA-012
    status: approved_later
    title: Previa DEV isolada dos adicionais
    statement: A simulacao de adicionais existe somente em desenvolvimento, precisa de ativacao explicita por parametro de URL, nao altera dados reais, nao grava em backend, carrinho, pedido ou snapshot, nao aparece em producao, serve apenas para homologacao visual e de interacao, e apos aprovacao os itens simulados serao removidos ou substituidos pela configuracao autoritativa real.
    prohibits:
      - renderizar simulacao de adicionais em producao
